openapi: 3.1.0
info:
  version: 1.0.0
  title: phonebook
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    This is a documentation of phonebook app
tags: 
  - name: Contacts
    description: Operation about contacts.
  - name: Auth
    description: Auth operation.
servers:
  - url: http://localhost:3000
  # - url: #посилання на задеплоєний сайт
paths:
  /contacts: 
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post: 
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get: 
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch: 
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete: 
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
  /users/register:
      post:
        $ref: ../swagger/paths/users/register/post.yaml
  /users/login:
      post:
        $ref: ../swagger/paths/users/login/post.yaml
  /users/refresh:
      post:
        $ref: ../swagger/paths/users/refresh/post.yaml
  /users/logout:
      post:
        $ref: ../swagger/paths/users/logout/post.yaml
  /users/verify:
      post:
        $ref: ../swagger/paths/users/verify/get.yaml
  /users/send-reset-email:
      post:
        $ref: ../swagger/paths/users/send-reset-email/post.yaml
  /users/send-reset-psw:
      post:
        $ref: ../swagger/paths/users/send-reset-psw/post.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer