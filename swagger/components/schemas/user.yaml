type: object
required:
  - _id
  - name
  - email
  - password
  - verify
properties:
  _id:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: myContactEmail@gmail.com
  password:
    description: "User's password"
    type: string
    example: MyBestPassword100%Works
  verify: 
    description: "Email verification"
    type: boolean
    example: true 