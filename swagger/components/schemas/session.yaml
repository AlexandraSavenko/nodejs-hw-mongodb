type: object
properties:
  _id:
    type: string
    example: "60d0fe4f5311236168a109ca"
  userId:
    type: string
    description: ID of the user this session belongs to
    example: "60d0fe4f5311236168a109c9"
  accessToken:
    type: string
    description: Hashed access token
    example: "e4f56f9a..."
  refreshToken:
    type: string
    description: Hashed refresh token
    example: "e4f56f9a..."
  accessTokenValidUntill:
    type: string
    description: Lifetine of an access token
    example: 2025-06-22T09:35:40.362+00:00
  refreshTokenValidUntill:
    type: string
    description: Lifetine of an refresh token
    example: 2025-06-29T09:20:40.362+00:00
  createdAt:
    type: string
    format: date-time
    example: "2023-01-01T00:00:00.000Z"
  updatedAt:
    type: string
    format: date-time
    example: "2023-01-10T12:00:00.000Z"
required:
  - uid
  - refreshToken