type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType  
  - photo
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: 555232300
  email:
    description: "Contact's email"
    type: string
    example: myContactEmail@gmail.com
  isFavourite:
    description: "Is this contact your favourite contact"
    type: boolean
    example: false
  contactType:
    description: 'Is this a contact from work or personal'
    type: string
    enum: ['work', "personal"]
  userId:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
